<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="Report by text or voice, AI service with Gemini extracts fields, a person confirms, Express scores and allocates. AI understands, Karwan decides.">
  <defs>
    <path id="p1" d="M 232 100 H 300"/>
    <path id="p2" d="M 532 100 H 600"/>
    <path id="p3" d="M 832 100 H 900"/>
    <path id="p4" d="M 1132 100 H 1180"/>
  </defs>
  <rect width="1280" height="250" rx="16" fill="#101319"/>
  <g font-family="system-ui,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <!-- node 1 -->
    <g transform="translate(40 50)">
      <rect width="192" height="100" rx="12" fill="#1c2230" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="96" y="40" fill="#C4F135" font-size="26">🎙 ⌨</text>
      <text x="96" y="68" fill="#fff" font-size="16" font-weight="700">Report</text>
      <text x="96" y="86" fill="#fff" fill-opacity="0.6" font-size="12">text or voice · EN / اردو</text>
    </g>
    <!-- node 2 -->
    <g transform="translate(300 50)">
      <rect width="232" height="100" rx="12" fill="#1c2230" stroke="#C4F135" stroke-opacity="0.6">
        <animate attributeName="stroke-opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="116" y="40" fill="#C4F135" font-size="26">✨</text>
      <text x="116" y="68" fill="#fff" font-size="16" font-weight="700">AI service · Gemini</text>
      <text x="116" y="86" fill="#fff" fill-opacity="0.6" font-size="12">extracts fields + confidence</text>
    </g>
    <!-- node 3 -->
    <g transform="translate(600 50)">
      <rect width="232" height="100" rx="12" fill="#1c2230" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="116" y="40" fill="#C4F135" font-size="26">📝</text>
      <text x="116" y="68" fill="#fff" font-size="16" font-weight="700">Editable form</text>
      <text x="116" y="86" fill="#fff" fill-opacity="0.6" font-size="12">badges show what to check</text>
    </g>
    <!-- node 4 -->
    <g transform="translate(900 50)">
      <rect width="232" height="100" rx="12" fill="#1c2230" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="116" y="40" fill="#C4F135" font-size="26">✅</text>
      <text x="116" y="68" fill="#fff" font-size="16" font-weight="700">Human confirms</text>
      <text x="116" y="86" fill="#fff" fill-opacity="0.6" font-size="12">nothing saved before this</text>
    </g>
    <!-- node 5 -->
    <g transform="translate(1180 50)">
      <rect width="84" height="100" rx="12" fill="#C4F135"/>
      <text x="42" y="46" fill="#101319" font-size="14" font-weight="800">Express</text>
      <text x="42" y="64" fill="#101319" font-size="11" font-weight="700">score +</text>
      <text x="42" y="78" fill="#101319" font-size="11" font-weight="700">allocate</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#C4F135" stroke-width="2" stroke-dasharray="6 6" fill="none" stroke-linecap="round">
    <use href="#p1"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></use>
    <use href="#p2"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></use>
    <use href="#p3"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></use>
    <use href="#p4"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></use>
  </g>
  <!-- travelling data dots -->
  <g fill="#ffffff">
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="0.75s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="1.5s"><mpath href="#p3"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" begin="2.25s"><mpath href="#p4"/></animateMotion></circle>
  </g>

  <text x="640" y="205" fill="#ffffff" fill-opacity="0.85" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">AI understands. <tspan fill="#C4F135">Karwan decides.</tspan></text>
  <text x="640" y="228" fill="#ffffff" fill-opacity="0.45" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">Scores, allocations, stock and deliveries are always calculated by Karwan's own rules, never by the AI.</text>
</svg>
